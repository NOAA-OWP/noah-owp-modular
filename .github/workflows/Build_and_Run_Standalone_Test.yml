# Test changes that have been pushed to the main branch

name: Testing and Validation

# Controls when the action will run.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Build the standalone driver and run the test suite via CTest
  test_unit:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Checkout the commit
      uses: actions/checkout@v4

    - name: Install NetCDF
      run: |
        if [ ${{ runner.os }} == 'Linux' ]
        then
          sudo apt-get update
          sudo apt-get install -y --fix-missing libnetcdf-dev libnetcdff-dev
        elif [ ${{ runner.os }} == 'macOS' ]
        then
          brew install netcdf netcdf-fortran
          # CMake does not search the Homebrew prefix by default.
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
          # Homebrew may only provide a version-suffixed gfortran.
          if command -v gfortran > /dev/null
          then
            echo "FC=gfortran" >> $GITHUB_ENV
          else
            echo "FC=$(ls $(brew --prefix)/bin/gfortran-* | sort -V | tail -1)" >> $GITHUB_ENV
          fi
        fi

    # The shared library is covered by test_shared_lib; leaving it off here keeps
    # this job free of the iso_c_fortran_bmi dependency.
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNOAHOWP_BUILD_SHARED=OFF

    - name: Build
      run: cmake --build build -j

    - name: Run standalone
      working-directory: run
      run: ../build/noah_owp_modular namelist.input

    # Runs the BMI driver test and the date/time unit test
    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Check install
      run: cmake --install build --prefix ${{ runner.temp }}/noahowp-install

  # Build the BMI shared library against iso_c_fortran_bmi
  test_shared_lib:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the commit
      uses: actions/checkout@v4
      with:
        path: noah-owp-modular

    - name: Checkout iso_c_fortran_bmi
      uses: actions/checkout@v4
      with:
        repository: NOAA-OWP/iso_c_fortran_bmi
        path: iso_c_fortran_bmi

    - name: Install NetCDF
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing libnetcdf-dev libnetcdff-dev

    # NOAHOWP_INSTALL=OFF because NOAA-OWP/iso_c_fortran_bmi installs iso_c_bmi
    # without adding it to an export set, which blocks exporting noahowpTargets.
    - name: Configure and build
      working-directory: noah-owp-modular
      run: |
        cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DNOAHOWP_BUILD_SHARED=ON \
              -DBUILD_TESTING=OFF \
              -DNOAHOWP_INSTALL=OFF \
              -DISO_C_FORTRAN_BMI_PATH=${{ github.workspace }}/iso_c_fortran_bmi
        cmake --build build -j

    # The registration function ngen resolves with dlsym once it dlopen()s the library
    - name: Check the library exports register_bmi
      working-directory: noah-owp-modular
      run: |
        test -f build/libnoahowpbmi.so
        nm -D --defined-only build/libnoahowpbmi.so | grep -w register_bmi
