# Test changes that have been pushed to the main branch

name: Testing and Validation

# Controls when the action will run.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Build the standalone driver and run the test suite via CTest
  test_unit:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Checkout the commit
      uses: actions/checkout@v4

    - name: Install NetCDF
      run: |
        if [ ${{ runner.os }} == 'Linux' ]
        then
          sudo apt-get update
          sudo apt-get install -y --fix-missing libnetcdf-dev libnetcdff-dev
        elif [ ${{ runner.os }} == 'macOS' ]
        then
          brew install netcdf netcdf-fortran
          # CMake does not search the Homebrew prefix by default.
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
          # Homebrew may only provide a version-suffixed gfortran.
          if command -v gfortran > /dev/null
          then
            echo "FC=gfortran" >> $GITHUB_ENV
          else
            echo "FC=$(ls $(brew --prefix)/bin/gfortran-* | sort -V | tail -1)" >> $GITHUB_ENV
          fi
        fi

    # The shared library is covered by test_shared_lib; leaving it off here keeps
    # this job free of the iso_c_fortran_bmi dependency.
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNOAHOWP_BUILD_SHARED=OFF

    - name: Build
      run: cmake --build build -j

    - name: Run standalone
      working-directory: run
      run: ../build/noah_owp_modular namelist.input

    # Runs the BMI driver test and the date/time unit test
    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Check install
      run: cmake --install build --prefix ${{ runner.temp }}/noahowp-install

  # Build the BMI shared library against iso_c_fortran_bmi
  test_shared_lib:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the commit
      uses: actions/checkout@v4
      with:
        path: noah-owp-modular

    - name: Checkout iso_c_fortran_bmi
      uses: actions/checkout@v4
      with:
        repository: NOAA-OWP/iso_c_fortran_bmi
        path: iso_c_fortran_bmi

    - name: Install NetCDF
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing libnetcdf-dev libnetcdff-dev

    # NOAHOWP_INSTALL=OFF because NOAA-OWP/iso_c_fortran_bmi installs iso_c_bmi
    # without adding it to an export set, which blocks exporting noahowpTargets.
    - name: Configure and build
      working-directory: noah-owp-modular
      run: |
        cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DNOAHOWP_BUILD_SHARED=ON \
              -DBUILD_TESTING=ON \
              -DNOAHOWP_INSTALL=OFF \
              -DISO_C_FORTRAN_BMI_PATH=${{ github.workspace }}/iso_c_fortran_bmi
        cmake --build build -j

    # The registration function ngen resolves with dlsym once it dlopen()s the library
    - name: Check the library exports register_bmi
      working-directory: noah-owp-modular
      run: |
        test -f build/libnoahowpbmi.so
        nm -D --defined-only build/libnoahowpbmi.so | grep -w register_bmi

    # Only this configuration builds the test that drives the protocol through the
    # iso_c_fortran_bmi entry points, which size transfers themselves.
    - name: Run tests
      working-directory: noah-owp-modular
      run: ctest --test-dir build --output-on-failure

  # Build everything again with Intel. gfortran accepts constructs the standard
  # does not, so a second front end is what catches them -- deallocating a
  # SELECT TYPE associate-name, malformed format specifications, and the like.
  # NetCDF-Fortran is built here rather than installed: .mod files are specific
  # to the compiler that wrote them, so the apt package cannot be read by Intel.
  test_intel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the commit
      uses: actions/checkout@v4
      with:
        path: noah-owp-modular

    - name: Checkout iso_c_fortran_bmi
      uses: actions/checkout@v4
      with:
        repository: NOAA-OWP/iso_c_fortran_bmi
        path: iso_c_fortran_bmi

    - name: Set up Intel Fortran
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: intel

    # The C library is compiler-independent, so the packaged one is fine.
    - name: Install NetCDF C
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing libnetcdf-dev

    - name: Cache NetCDF-Fortran
      id: cache-netcdff
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/netcdff
        key: netcdff-4.6.1-intel-${{ runner.os }}

    - name: Build NetCDF-Fortran with Intel
      if: steps.cache-netcdff.outputs.cache-hit != 'true'
      run: |
        curl -sL https://github.com/Unidata/netcdf-fortran/archive/refs/tags/v4.6.1.tar.gz | tar xz
        cd netcdf-fortran-4.6.1
        ./configure --prefix=${{ runner.temp }}/netcdff --disable-shared \
                    CC=icx FC=ifx F77=ifx \
                    CPPFLAGS="$(nc-config --cflags)" LDFLAGS="$(nc-config --libs)"
        make -j$(nproc)
        make install

    # NOAHOWP_INSTALL=OFF for the same reason as test_shared_lib above.
    - name: Configure and build
      working-directory: noah-owp-modular
      run: |
        cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DNOAHOWP_BUILD_SHARED=ON \
              -DBUILD_TESTING=ON \
              -DNOAHOWP_INSTALL=OFF \
              -DNetCDF_ROOT=${{ runner.temp }}/netcdff \
              -DISO_C_FORTRAN_BMI_PATH=${{ github.workspace }}/iso_c_fortran_bmi
        cmake --build build -j

    # Same check as test_shared_lib, and it matters more here: the bind(C) name
    # is the ABI contract with ngen, and this is a different front end mangling it.
    - name: Check the library exports register_bmi
      working-directory: noah-owp-modular
      run: |
        test -f build/libnoahowpbmi.so
        nm -D --defined-only build/libnoahowpbmi.so | grep -w register_bmi

    - name: Run tests
      working-directory: noah-owp-modular
      run: ctest --test-dir build --output-on-failure
